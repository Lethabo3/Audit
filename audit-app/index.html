<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #fff; --fg: #000; --muted: #888; --border: #e0e0e0; --critical: #d00; --warning: #666; --clean: #000; }
        body { background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        .connect-screen { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem; animation: fadeIn 0.6s ease; }
        .connect-screen.hidden { display: none; }
        .connect-title { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
        .connect-form { display: flex; flex-direction: column; gap: 1rem; width: 480px; max-width: 90vw; }
        .input-group { display: flex; flex-direction: column; gap: 0.375rem; }
        .input-label { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
        .connect-input { background: transparent; border: 1px solid var(--border); color: var(--fg); font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; padding: 0.875rem 1rem; outline: none; transition: border-color 0.2s ease; }
        .connect-input:focus { border-color: var(--fg); }
        .connect-input::placeholder { color: var(--muted); }
        .connect-btn { background: var(--fg); color: var(--bg); border: none; padding: 0.875rem 1rem; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s ease; margin-top: 0.5rem; }
        .connect-btn:hover { opacity: 0.8; }
        .connect-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .connect-hint { font-size: 0.6875rem; color: var(--muted); text-align: center; }
        .connect-error { font-size: 0.75rem; color: var(--critical); text-align: center; }
        .main-interface { display: none; height: 100vh; animation: fadeIn 0.4s ease; }
        .main-interface.active { display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { border-right: 1px solid var(--border); padding: 2rem 0; overflow-y: auto; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 1.5rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .sidebar-title { font-size: 0.625rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
        .db-name { font-family: 'IBM Plex Mono', monospace; font-size: 0.875rem; }
        .table-list { list-style: none; flex: 1; overflow-y: auto; }
        .table-item { padding: 0.625rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; transition: background 0.15s ease; font-size: 0.875rem; }
        .table-item:hover { background: var(--border); }
        .table-item.active { background: var(--border); }
        .table-info { display: flex; flex-direction: column; gap: 0.125rem; flex: 1; min-width: 0; }
        .table-name { font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .table-meta { font-size: 0.6875rem; color: var(--muted); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--clean); flex-shrink: 0; }
        .status-dot.warning { background: var(--warning); }
        .status-dot.critical { background: var(--critical); }
        .sidebar-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); }
        .audit-btn { width: 100%; background: var(--fg); color: var(--bg); border: none; padding: 0.75rem 1rem; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s ease; }
        .audit-btn:hover { opacity: 0.8; }
        .audit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .content { display: flex; flex-direction: column; height: 100vh; }
        .command-bar { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); }
        .command-input { background: transparent; border: none; color: var(--fg); font-family: 'IBM Plex Mono', monospace; font-size: 0.875rem; width: 100%; outline: none; }
        .command-input::placeholder { color: var(--muted); }
        .audit-feed { flex: 1; overflow-y: auto; padding: 2rem; }
        .audit-summary { margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
        .summary-stats { display: flex; gap: 3rem; }
        .stat { display: flex; flex-direction: column; gap: 0.25rem; }
        .stat-value { font-size: 2rem; font-weight: 500; letter-spacing: -0.02em; }
        .stat-label { font-size: 0.625rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
        .finding-card { padding: 1.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .finding-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; }
        .finding-severity { font-size: 0.625rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }
        .finding-severity.critical { color: var(--critical); }
        .finding-severity.warning { color: var(--warning); }
        .finding-location { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--muted); }
        .finding-type { font-family: 'IBM Plex Mono', monospace; font-size: 0.625rem; color: var(--muted); padding: 0.125rem 0.375rem; background: var(--border); border-radius: 2px; }
        .finding-summary { font-size: 0.9375rem; max-width: 720px; }
        .finding-details { display: none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
        .finding-card.expanded .finding-details { display: block; animation: slideDown 0.3s ease; }
        .finding-analysis { font-size: 0.875rem; color: var(--muted); max-width: 720px; margin-bottom: 1rem; line-height: 1.7; }
        .finding-sample { background: #f5f5f5; padding: 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.6875rem; overflow-x: auto; margin-bottom: 1.5rem; white-space: pre; max-height: 200px; overflow-y: auto; }
        .finding-fix { font-size: 0.875rem; }
        .fix-label { font-size: 0.625rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
        .loading-details { color: var(--muted); font-size: 0.875rem; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
        .empty-state p { margin-bottom: 0.5rem; }
        .ai-response { padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
        .ai-response-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.75rem; }
        .ai-response-label { font-size: 0.625rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }
        .ai-response-query { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--muted); }
        .ai-response-content { font-size: 0.9375rem; max-width: 720px; line-height: 1.7; white-space: pre-wrap; }
        .streaming::after { content: '▊'; animation: blink 0.8s infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    </style>
</head>
<body>
    <div class="connect-screen" id="connectScreen">
        <span class="connect-title">Audit</span>
        <div class="connect-form">
            <div class="input-group">
                <span class="input-label">Project URL</span>
                <input type="text" class="connect-input" id="projectUrlInput" placeholder="xxxxxxxxxxxx.supabase.co" autocomplete="off" spellcheck="false">
            </div>
            <div class="input-group">
                <span class="input-label">Anon Key</span>
                <input type="text" class="connect-input" id="anonKeyInput" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." autocomplete="off" spellcheck="false">
            </div>
            <button class="connect-btn" id="connectBtn">Connect</button>
        </div>
        <span class="connect-hint">find these in your Supabase project settings → API</span>
        <span class="connect-error" id="connectError"></span>
    </div>

    <div class="main-interface" id="mainInterface">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Connected</div>
                <div class="db-name" id="dbName">project</div>
            </div>
            <ul class="table-list" id="tableList"></ul>
            <div class="sidebar-footer">
                <button class="audit-btn" id="auditBtn">Run Audit</button>
            </div>
        </aside>
        <main class="content">
            <div class="command-bar">
                <input type="text" class="command-input" id="commandInput" placeholder="ask anything about your data..." autocomplete="off" spellcheck="false">
            </div>
            <div class="audit-feed" id="auditFeed">
                <div class="audit-summary" id="auditSummary" style="display: none;">
                    <div class="summary-stats">
                        <div class="stat"><span class="stat-value" id="totalFindings">0</span><span class="stat-label">Findings</span></div>
                        <div class="stat"><span class="stat-value" id="criticalCount">0</span><span class="stat-label">Critical</span></div>
                        <div class="stat"><span class="stat-value" id="tablesScanned">0</span><span class="stat-label">Tables</span></div>
                    </div>
                </div>
                <div id="findingsContainer">
                    <div class="empty-state"><p>No audit results yet.</p><p style="font-size: 0.8125rem;">Click "Run Audit" to analyze your database.</p></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentFindings = [], currentTables = [];

        const $ = id => document.getElementById(id);
        const connectScreen = $('connectScreen'), mainInterface = $('mainInterface');
        const projectUrlInput = $('projectUrlInput'), anonKeyInput = $('anonKeyInput');
        const connectBtn = $('connectBtn'), connectError = $('connectError');
        const dbName = $('dbName'), tableList = $('tableList');
        const findingsContainer = $('findingsContainer'), commandInput = $('commandInput');
        const auditBtn = $('auditBtn'), auditSummary = $('auditSummary');

        connectBtn.onclick = connect;
        projectUrlInput.onkeypress = e => e.key === 'Enter' && anonKeyInput.focus();
        anonKeyInput.onkeypress = e => e.key === 'Enter' && connect();

        async function connect() {
            const projectUrl = projectUrlInput.value.trim(), anonKey = anonKeyInput.value.trim();
            if (!projectUrl || !anonKey) { connectError.textContent = 'Both fields are required'; return; }
            connectBtn.disabled = true; connectBtn.textContent = 'Connecting...'; connectError.textContent = '';
            try {
                const res = await fetch(`${API_BASE}/api/connect`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ projectUrl, anonKey }) });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                connectBtn.textContent = 'Loading schema...';
                const schemaRes = await fetch(`${API_BASE}/api/schema`);
                const schemaData = await schemaRes.json();
                if (schemaData.error) throw new Error(schemaData.error);
                currentTables = schemaData.tables;
                connectScreen.classList.add('hidden'); mainInterface.classList.add('active');
                dbName.textContent = data.projectName; renderTables();
            } catch (e) { connectError.textContent = e.message; connectBtn.disabled = false; connectBtn.textContent = 'Connect'; }
        }

        function renderTables() {
            if (!currentTables.length) { tableList.innerHTML = '<li style="padding:1rem 1.5rem;color:var(--muted);font-size:0.8125rem;">No accessible tables</li>'; return; }
            tableList.innerHTML = currentTables.map(t => `<li class="table-item" data-table="${t.name}"><span class="status-dot ${t.status}"></span><div class="table-info"><span class="table-name">${t.name}</span><span class="table-meta">${t.rowCount.toLocaleString()} rows · ${t.columns.length} cols</span></div></li>`).join('');
            document.querySelectorAll('.table-item').forEach(item => item.onclick = () => { document.querySelectorAll('.table-item').forEach(i => i.classList.remove('active')); item.classList.add('active'); filterFindings(item.dataset.table); });
        }

        auditBtn.onclick = async () => {
            auditBtn.disabled = true; auditBtn.textContent = 'Analyzing...';
            findingsContainer.innerHTML = '<div class="empty-state"><p class="streaming">Scanning tables</p></div>';
            try {
                const res = await fetch(`${API_BASE}/api/audit`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                currentFindings = data.findings; currentTables = data.tables;
                renderTables(); renderFindings();
                $('totalFindings').textContent = data.summary.totalFindings;
                $('criticalCount').textContent = data.summary.criticalCount;
                $('tablesScanned').textContent = data.summary.tablesScanned;
                auditSummary.style.display = 'block';
            } catch (e) { findingsContainer.innerHTML = `<div class="empty-state"><p style="color:var(--critical);">Audit failed: ${e.message}</p></div>`; }
            finally { auditBtn.disabled = false; auditBtn.textContent = 'Run Audit'; }
        };

        function renderFindings(findings = currentFindings) {
            if (!findings.length) { findingsContainer.innerHTML = '<div class="empty-state"><p>No issues found.</p><p style="font-size:0.8125rem;">Your data looks clean!</p></div>'; return; }
            findingsContainer.innerHTML = findings.map((f,i) => `<div class="finding-card" data-index="${i}"><div class="finding-header"><span class="finding-severity ${f.severity}">${f.severity}</span><span class="finding-location">${f.table}.${f.column}</span><span class="finding-type">${f.type.replace(/_/g,' ')}</span></div><p class="finding-summary">${f.summary}</p><div class="finding-details"><p class="loading-details streaming">Loading analysis</p></div></div>`).join('');
            document.querySelectorAll('.finding-card').forEach((card,idx) => card.onclick = async () => { const wasExpanded = card.classList.contains('expanded'); card.classList.toggle('expanded'); if (!wasExpanded && !card.dataset.loaded) await loadDetails(card, findings[idx]); });
        }

        async function loadDetails(card, finding) {
            try {
                const res = await fetch(`${API_BASE}/api/analyze`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ finding }) });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                card.querySelector('.finding-details').innerHTML = `${data.analysis.analysis ? `<p class="finding-analysis">${data.analysis.analysis}</p>` : ''}${data.analysis.impact ? `<p class="finding-analysis"><strong>Impact:</strong> ${data.analysis.impact}</p>` : ''}${data.sampleData?.length ? `<div class="fix-label">Sample Data</div><pre class="finding-sample">${formatSample(data.sampleData)}</pre>` : ''}<div class="finding-fix"><div class="fix-label">Recommended Fix</div><p>${data.analysis.fix || 'Review data and apply constraints.'}</p></div>`;
                card.dataset.loaded = 'true';
            } catch (e) { card.querySelector('.finding-details').innerHTML = `<p style="color:var(--critical);">Failed: ${e.message}</p>`; }
        }

        function formatSample(rows) {
            if (!rows?.length) return 'No sample data';
            const cols = Object.keys(rows[0]);
            const widths = cols.map(c => Math.min(25, Math.max(c.length, ...rows.map(r => String(r[c] ?? 'NULL').slice(0,25).length))));
            const header = cols.map((c,i) => c.slice(0,25).padEnd(widths[i])).join(' │ ');
            const sep = widths.map(w => '─'.repeat(w)).join('─┼─');
            const data = rows.map(r => cols.map((c,i) => String(r[c] ?? 'NULL').slice(0,25).padEnd(widths[i])).join(' │ ')).join('\n');
            return `${header}\n${sep}\n${data}`;
        }

        function filterFindings(table) {
            const filtered = currentFindings.filter(f => f.table === table);
            renderFindings(filtered);
            $('totalFindings').textContent = filtered.length;
            $('criticalCount').textContent = filtered.filter(f => f.severity === 'critical').length;
        }

        commandInput.onkeypress = async e => {
            if (e.key === 'Enter' && commandInput.value.trim()) {
                const query = commandInput.value.trim(); commandInput.value = '';
                const el = document.createElement('div'); el.className = 'ai-response';
                el.innerHTML = `<div class="ai-response-header"><span class="ai-response-label">AI Insight</span><span class="ai-response-query">${query}</span></div><p class="ai-response-content streaming">Thinking</p>`;
                findingsContainer.insertBefore(el, findingsContainer.firstChild);
                try {
                    const res = await fetch(`${API_BASE}/api/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    el.querySelector('.ai-response-content').classList.remove('streaming');
                    el.querySelector('.ai-response-content').textContent = data.response;
                } catch (e) { el.querySelector('.ai-response-content').innerHTML = `<span style="color:var(--critical);">Error: ${e.message}</span>`; el.querySelector('.ai-response-content').classList.remove('streaming'); }
            }
        };

        projectUrlInput.focus();
    </script>
</body>
</html>
